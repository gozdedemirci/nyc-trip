<title>New York Family Trip</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: phone-first single column — cartoon header, day tabs, sticky illustrated map, then the day's stop cards. */
:root{
  --bg:#eef3f6; --surface:#ffffff; --surface-2:#f7f3ea; --ink:#1e2a33; --muted:#5b6974; --line:#dbe3e8;
  --water:#bfdaea; --water-ink:#5b8fb0; --land:#f7f0e2; --land-edge:#e4d6bb; --park:#cfe0a9; --park-edge:#a9c47a;
  --thu:#d55a22; --fri:#a61e2b; --sat:#16788a; --gold:#e3a420; --pin-ink:#ffffff; --halo:#f7f0e2;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1820; --surface:#18242f; --surface-2:#1e2c38; --ink:#edf2f5; --muted:#9fb0bd; --line:#2a3a47;
  --water:#163247; --water-ink:#6f9fc0; --land:#25313b; --land-edge:#34434f; --park:#2c4630; --park-edge:#3f6343;
  --thu:#f07a3e; --fri:#e2505c; --sat:#38aec2; --gold:#f2bd45; --pin-ink:#0f1820; --halo:#25313b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1820; --surface:#18242f; --surface-2:#1e2c38; --ink:#edf2f5; --muted:#9fb0bd; --line:#2a3a47;
  --water:#163247; --water-ink:#6f9fc0; --land:#25313b; --land-edge:#34434f; --park:#2c4630; --park-edge:#3f6343;
  --thu:#f07a3e; --fri:#e2505c; --sat:#38aec2; --gold:#f2bd45; --pin-ink:#0f1820; --halo:#25313b; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;margin:0}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}

/* header */
header{padding-block:14px 6px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.lang{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:none;padding:5px 12px;border-radius:999px;font-weight:800;font-size:13px;letter-spacing:.06em;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.dates{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.hero{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:end;margin-top:6px}
.hero svg{width:150px;height:auto;display:block}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1;margin:0 0 6px;text-wrap:balance}
.hero p{margin:0 0 10px;color:var(--muted);font-size:15px;text-wrap:pretty}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-block:10px 12px}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 6px;cursor:pointer;text-align:center;min-width:0}
.tab b{display:block;font-family:var(--display);font-size:18px;line-height:1.1}
.tab span{font-size:12px;color:var(--muted);font-weight:700}
.tab[aria-selected="true"]{border-color:var(--c);background:var(--c);color:#fff}
.tab[aria-selected="true"] span{color:#fff;opacity:.9}

/* day summary */
.daybar{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted);margin-bottom:10px}
.daybar strong{color:var(--ink)}
.daytheme{font-family:var(--display);font-size:22px;font-weight:700;margin:0 0 2px;color:var(--c)}

/* map */
.mapbox{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:4px 8px}
.map{position:relative;height:min(46vh,420px);border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--water);touch-action:none}
.map svg{width:100%;height:100%;display:block;cursor:grab}
.map svg:active{cursor:grabbing}
.mapctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:18px;cursor:pointer;display:grid;place-items:center}
.legend{position:absolute;left:8px;bottom:8px;background:color-mix(in srgb,var(--surface) 88%,transparent);border-radius:10px;padding:4px 8px;font-size:11px;font-weight:700;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;max-width:calc(100% - 16px)}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid var(--muted);vertical-align:middle;margin-right:4px}
.legend .lw i{border-top-style:dotted}
.legend .lf i{border-top:3px dashed var(--water-ink)}
.lbl{font-family:var(--body);font-weight:800;fill:var(--muted);paint-order:stroke;stroke:var(--halo);stroke-linejoin:round;letter-spacing:.05em}
.lbl.w{fill:var(--water-ink);stroke:var(--water);font-style:italic;font-weight:700}
.pin{cursor:pointer}

/* bonus */
.bonus{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:2px dashed var(--gold);border-radius:14px;padding:10px 12px;margin-block:4px 10px;font-size:14px}
.bonus b{font-family:var(--display);font-size:16px}

/* stops */
.stops{list-style:none;margin:0;padding:0 0 40px;display:flex;flex-direction:column;gap:10px}
.stop{background:var(--surface);border:2px solid transparent;border-radius:16px;padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:40px 1fr 58px;gap:4px 12px;text-align:left;width:100%}
.pic{grid-column:3;grid-row:1;width:58px;height:58px;background:var(--surface-2);border-radius:14px;padding:5px;overflow:hidden}
.st-head{grid-column:2;grid-row:1}
.stop[aria-current="true"]{border-color:var(--c);box-shadow:0 4px 18px color-mix(in srgb,var(--c) 22%,transparent)}
.num{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;grid-row:span 2}
.st-head{min-width:0}
.time{font-variant-numeric:tabular-nums;font-weight:800;color:var(--c);font-size:14px;letter-spacing:.03em}
.now{display:inline-block;margin-left:6px;background:var(--gold);color:#1e2a33;border-radius:999px;padding:0 8px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.stop h3{font-family:var(--display);font-size:19px;line-height:1.15;margin:1px 0 0;font-weight:700}
.st-body{min-width:0;grid-column:2 / span 2}
.how{display:flex;gap:6px;align-items:flex-start;font-size:13.5px;color:var(--muted);font-weight:600;margin:2px 0 6px}
.how svg{flex:none;width:18px;height:18px;margin-top:1px}
.note{margin:0;font-size:15px;text-wrap:pretty}
.words{margin-top:9px;padding:8px 10px;background:var(--surface-2);border-radius:10px;font-size:13.5px}
.words small{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.words ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 14px}
.words li b{font-weight:800}
.words li span{color:var(--muted)}
.stop a{color:var(--c);font-weight:800}
.tips{background:var(--surface);border-radius:16px;padding:12px 14px;font-size:14.5px;margin-bottom:10px}
.tips h4{margin:0 0 4px;font-family:var(--display);font-size:16px}
.tips ul{margin:0;padding-left:18px}
footer{color:var(--muted);font-size:12.5px;padding-block:0 30px;text-align:center}
/* ---- header cartoon scenes ---- */
.hero svg{width:165px}
#art *{transform-box:view-box}
#art .scene,#art #g-arm-up,#art #d-arm-up,#art #bubble{display:none}
#art.s-thu .p-thu,#art.s-fri .p-fri,#art.s-sat .p-sat{display:inline}
#art.greet #g-arm-up,#art.greet #d-arm-up{display:inline}
#art.greet #g-arm-down,#art.greet #d-arm-down{display:none}
#art.says #bubble{display:inline;animation:pop .35s cubic-bezier(.3,1.6,.6,1) both;transform-origin:110px 30px}
#art.s-sat .shadow{display:none}
.leaves path{animation:fall 9s linear infinite}
.leaves .lf2{animation-delay:-3s;animation-duration:11s}
.leaves .lf3{animation-delay:-6s;animation-duration:10s}
@keyframes fall{0%{transform:translate(0,-30px) rotate(0)}100%{transform:translate(-14px,215px) rotate(320deg)}}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
/* greeting: wave both hands */
.wave{animation:wave .55s ease-in-out 5 alternate}
.w2{animation-delay:.12s}
@keyframes wave{0%{transform:rotate(-14deg)}100%{transform:rotate(16deg)}}
#art.greet #pg,#art.greet #pd{animation:hop .5s ease-out 2 alternate}
#art.greet #pd{animation-delay:.15s}
@keyframes hop{0%{transform:translateY(0)}100%{transform:translateY(-5px)}}
/* Thursday: balloon rises and bobs */
#art.s-thu .rise{animation:rise 1.1s cubic-bezier(.2,.9,.3,1) both}
#art.s-thu .bob{animation:bob 2.6s 1.1s ease-in-out infinite alternate;transform-origin:21px 136px}
@keyframes rise{0%{transform:translateY(70px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes bob{0%{transform:rotate(-5deg)}100%{transform:rotate(5deg)}}
/* Friday: walking bounce, swinging bags */
#art.s-fri #pg,#art.s-fri #pm,#art.s-fri #pd{animation:step .38s ease-in-out 8 alternate}
#art.s-fri #pm{animation-delay:.19s}
@keyframes step{0%{transform:translateY(0)}100%{transform:translateY(-4px)}}
#art.s-fri .swing{animation:swing .6s ease-in-out infinite alternate}
#art.s-fri .s2{animation-delay:-.3s}
@keyframes swing{0%{transform:rotate(-12deg)}100%{transform:rotate(12deg)}}
#art.s-fri .sparkle path{animation:twinkle 1.2s ease-in-out infinite alternate;transform-origin:center;transform-box:fill-box}
@keyframes twinkle{0%{opacity:.2;transform:scale(.6)}100%{opacity:1;transform:scale(1.1)}}
/* Saturday: ferry slides in, they jump on, then gently rock */
#art.s-sat .sail{animation:sailin 1s cubic-bezier(.2,.8,.3,1) both}
#art.s-sat .slide-water{animation:fadein .5s both}
#art.s-sat #trio{animation:jump .7s .95s cubic-bezier(.3,0,.4,1) both}
#art.s-sat #rock{animation:rock 2.4s 1.7s ease-in-out infinite alternate;transform-origin:110px 200px}
#art.s-sat .waves{animation:waves 2s linear infinite}
@keyframes sailin{0%{transform:translateX(240px)}100%{transform:translateX(0)}}
@keyframes fadein{0%{opacity:0}100%{opacity:1}}
@keyframes jump{0%{transform:translateY(0)}45%{transform:translateY(-30px)}75%{transform:translateY(-4px)}100%{transform:translateY(-6px)}}
@keyframes rock{0%{transform:rotate(-1.8deg)}100%{transform:rotate(1.8deg)}}
@keyframes waves{0%{transform:translateX(0)}100%{transform:translateX(24px)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}#art.s-sat #trio{transform:translateY(-6px)}}
</style>

  <div class="hero">

        <path d="M45 96h5M45 104h5M45 112h5M45 120h5" stroke="#8d1720" stroke-width="1.2"/>
        <circle cx="59" cy="47" r="7" fill="#6b4a36"/>

  ave([40.7050,-74.0130],[40.8100,-73.9640]); // roughly Broadway-ish spine
  svg.labelsG=el('g',{},svg); svg.routesG=el('g',{},svg); svg.pinsG=el('g',{},svg);
}
function drawDay(){
  const d=DAYS[day], c=`var(${d.color})`;
  const L=svg.labelsG; L.innerHTML='';
  T.labels.forEach(([tr,en,la,ln,w])=>{const [x,y]=P(la,ln); const t=el('text',{x,y,class:'lbl'+(w?' w':''),'text-anchor':'middle'},L); t.textContent=lang==='tr'?tr:en; t.dataset.base=w?10:11;});
  const R=svg.routesG; R.innerHTML='';
  let prev=HOME.ll;
  d.stops.forEach((s,i)=>{
    const a=P(...prev), b=P(...s.ll);
    const ferry=s.mode==='ferry', walk=s.mode==='walk';
    const path=el('path',{d:`M${a[0]},${a[1]}L${b[0]},${b[1]}`,fill:'none',stroke:ferry?'var(--water-ink)':c,'stroke-linecap':'round','data-mode':s.mode,opacity:walk?1:.75},R);
    prev=s.ll;
  });
  const G=svg.pinsG; G.innerHTML='';
  // home
  const [hx,hy]=P(...HOME.ll); const hg=el('g',{class:'pin',transform:`translate(${hx},${hy})`},G); hg.dataset.x=hx; hg.dataset.y=hy;
  el('circle',{r:11,fill:'var(--surface)',stroke:'var(--ink)','stroke-width':2},hg);
  el('path',{d:'M-6 1 L0 -5 L6 1 M-4 0 V6 H4 V0',fill:'none',stroke:'var(--ink)','stroke-width':2,'stroke-linejoin':'round'},hg);
  // bonus pin
  if(d.bonus && nyNow().date<=d.bonus.until){const [bx,by]=P(...d.bonus.ll); const bg=el('g',{class:'pin',transform:`translate(${bx},${by})`},G); bg.dataset.x=bx;bg.dataset.y=by;
    el('circle',{r:9,fill:'var(--gold)',stroke:'var(--surface)','stroke-width':2},bg); const t=el('text',{'text-anchor':'middle',y:4,'font-size':11,'font-weight':800,fill:'#1e2a33'},bg); t.textContent='★';}
  const cur=currentIdx(d);
  d.stops.forEach((s,i)=>{
    if(i===d.stops.length-1 && s.ll[0]===40.7939) return; // last leg ends at home station; skip duplicate pin
    const [x,y]=P(...s.ll);
    const g=el('g',{class:'pin',transform:`translate(${x},${y})`,tabindex:0,role:'button','aria-label':`${i+1}. ${s.name[lang]}`},G);
    g.dataset.x=x; g.dataset.y=y; g.dataset.i=i;
    el('circle',{r:i===active?14:11,fill:c,stroke:'var(--surface)','stroke-width':2.5},g);
    const t=el('text',{'text-anchor':'middle',y:4.5,'font-size':12.5,'font-weight':800,fill:'#fff','font-family':'Nunito, sans-serif'},g); t.textContent=i+1;
    g.addEventListener('click',()=>select(i,true));
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(i,true)}});
  });
  // trio marker: at current stop if today, else at home
  const tIdx=active>=0?active:cur;
  const tp=tIdx>=0?P(...d.stops[tIdx].ll):[hx,hy];
  const tg=el('g',{transform:`translate(${tp[0]},${tp[1]})`,'pointer-events':'none'},G); tg.dataset.x=tp[0]; tg.dataset.y=tp[1]; tg.dataset.dy=-26;
  el('rect',{x:-22,y:-11,width:44,height:22,rx:11,fill:'var(--surface)',stroke:`var(${d.color})`,'stroke-width':2},tg);
  // mini heads: daughter, mom, dad
  el('circle',{cx:-12,cy:0,r:6,fill:'#f3cfae'},tg); el('path',{d:'M-18 -1 Q-18 -7 -12 -7 Q-6 -7 -6 -1 Q-9 -4 -12 -4 Q-15 -4 -18 -1Z',fill:'#6b4a36'},tg);
  el('circle',{cx:-14,cy:0.5,r:1.8,fill:'none',stroke:'#2b2b2b','stroke-width':.8},tg); el('circle',{cx:-10,cy:0.5,r:1.8,fill:'none',stroke:'#2b2b2b','stroke-width':.8},tg);
  el('circle',{cx:0,cy:0,r:7,fill:'#c9cbd1'},tg); el('ellipse',{cx:0,cy:.5,rx:4,ry:4.8,fill:'#f2cba9'},tg); el('rect',{x:-3.6,y:-1.5,width:7.2,height:2.4,rx:1,fill:'#2a2a30'},tg);
  el('circle',{cx:12,cy:0,r:6,fill:'#e8bf9c'},tg); el('path',{d:'M6 -1 Q6 -7 12 -7 Q18 -7 18 -1Z',fill:'#1b1c20'},tg); el('rect',{x:5,y:-2,width:14,height:1.8,rx:.9,fill:'#111215'},tg);
  svg.trio=tg;
  layout();
}

/* ---------- viewBox / zoom ---------- */
let vb={...FULL}, anim=null;
function unitsPerPx(){const r=svg.getBoundingClientRect();if(!r.width)return 1;return Math.max(vb.w/r.width,vb.h/r.height);}
function layout(){
  svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const s=unitsPerPx();
  svg.pinsG.querySelectorAll('g').forEach(g=>{if(g.parentNode!==svg.pinsG)return; const dy=(+g.dataset.dy||0)*s; g.setAttribute('transform',`translate(${g.dataset.x},${+g.dataset.y+dy}) scale(${s})`);});
  svg.labelsG.querySelectorAll('text').forEach(t=>{t.setAttribute('font-size',(+t.dataset.base)*s);t.setAttribute('stroke-width',3*s);});
  svg.routesG.querySelectorAll('path').forEach(p=>{const m=p.dataset.mode;
    p.setAttribute('stroke-width',(m==='walk'?3.5:3)*s);
    p.setAttribute('stroke-dasharray',m==='walk'?`${.1*s} ${6*s}`:m==='ferry'?`${7*s} ${5*s}`:`${10*s} ${5*s}`);});
}
function animateTo(t){
  cancelAnimationFrame(anim); const f={...vb}, t0=performance.now(), D=matchMedia('(prefers-reduced-motion: reduce)').matches?1:480;
  const step=n=>{let k=Math.min(1,(n-t0)/D); k=1-Math.pow(1-k,3); for(const p of ['x','y','w','h']) vb[p]=f[p]+(t[p]-f[p])*k; layout(); if(k<1) anim=requestAnimationFrame(step);};
  anim=requestAnimationFrame(step);
}
function boxFor(pts,pad=50){
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  let x0=Math.min(...xs)-pad,x1=Math.max(...xs)+pad,y0=Math.min(...ys)-pad,y1=Math.max(...ys)+pad;
  const r=svg.getBoundingClientRect(), ar=r.width&&r.height?r.width/r.height:1;
  let w=Math.max(x1-x0,160), h=Math.max(y1-y0,160); const cx=(x0+x1)/2, cy=(y0+y1)/2;
  if(w/h<ar) w=h*ar; else h=w/ar;
  return {x:cx-w/2,y:cy-h/2,w,h};
}
function fitDay(){const d=DAYS[day]; animateTo(boxFor([HOME.ll,...d.stops.map(s=>s.ll)].map(ll=>P(...ll)),40));}
function zoom(f,cx,cy){ cx??=vb.x+vb.w/2; cy??=vb.y+vb.h/2; const w=Math.min(Math.max(vb.w*f,60),FULL.w*2.2), h=w*vb.h/vb.w; animateTo({x:cx-(cx-vb.x)*w/vb.w,y:cy-(cy-vb.y)*h/vb.h,w,h}); }
document.getElementById('zin').onclick=()=>zoom(.6);
document.getElementById('zout').onclick=()=>zoom(1.6);
document.getElementById('zfit').onclick=()=>{active=-1;renderStops();drawDay();fitDay();};
// drag to pan
// drag to pan, two fingers to pinch-zoom
let drag=null, pinch=null; const ptrs=new Map();
const toUnits=(cx,cy)=>{const r=svg.getBoundingClientRect(), s=unitsPerPx(); return [vb.x+(cx-r.left-(r.width-vb.w/s)/2)*s, vb.y+(cy-r.top-(r.height-vb.h/s)/2)*s];};
svg.addEventListener('pointerdown',e=>{
  if(e.target.closest('.pin'))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); try{svg.setPointerCapture(e.pointerId)}catch(_){}
  cancelAnimationFrame(anim);
  if(ptrs.size===2){const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),vb:{...vb},c:toUnits((a.x+b.x)/2,(a.y+b.y)/2)}; drag=null;}
  else if(ptrs.size===1){drag={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y};}
});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()]; const f=pinch.d/Math.max(20,Math.hypot(a.x-b.x,a.y-b.y));
    const w=Math.min(Math.max(pinch.vb.w*f,60),FULL.w*2.2), k=w/pinch.vb.w, [cx,cy]=pinch.c;
    vb={x:cx-(cx-pinch.vb.x)*k,y:cy-(cy-pinch.vb.y)*k,w,h:pinch.vb.h*k}; layout(); return;}
  if(!drag)return; const s=unitsPerPx(); vb.x=drag.vx-(e.clientX-drag.x)*s; vb.y=drag.vy-(e.clientY-drag.y)*s; layout();
});
const endDrag=e=>{ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=null; if(ptrs.size===0) drag=null;
  else if(ptrs.size===1){const [p]=[...ptrs.values()]; drag={x:p.x,y:p.y,vx:vb.x,vy:vb.y};}};
svg.addEventListener('pointerup',endDrag); svg.addEventListener('pointercancel',endDrag);
svg.addEventListener('wheel',e=>{e.preventDefault(); const r=svg.getBoundingClientRect(), s=unitsPerPx(); const cx=vb.x+(e.clientX-r.left-(r.width-vb.w/s)/2)*s, cy=vb.y+(e.clientY-r.top-(r.height-vb.h/s)/2)*s; zoom(e.deltaY>0?1.25:.8,cx,cy);},{passive:false});
addEventListener('resize',layout);

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
function renderChrome(){
  document.documentElement.lang=lang;
  $('btn-tr').setAttribute('aria-pressed',lang==='tr'); $('btn-en').setAttribute('aria-pressed',lang==='en');
  $('title').textContent=T.title[lang]; $('subtitle').textContent=T.subtitle[lang]; $('dates').textContent=T.dates[lang];
  $('foot').textContent=T.foot[lang];
  $('tabs').innerHTML=DAYS.map((d,i)=>`<button class="tab" role="tab" type="button" id="tab-${d.id}" style="--c:var(${d.color})" aria-selected="${i===day}"><b>${d.tab[lang][0]}</b><span>${d.tab[lang][1]}</span></button>`).join('');
  DAYS.forEach((d,i)=>$('tab-'+d.id).onclick=()=>{day=i;active=-1;renderAll();fitDay();playScene(false);});
  const L=T.legend; $('legend').innerHTML=`<span class="lw"><i style="border-color:var(${DAYS[day].color})"></i>${L.walk[lang]}</span><span><i style="border-top-style:dashed;border-color:var(${DAYS[day].color})"></i>${L.ride[lang]}</span><span class="lf"><i></i>${L.ferry[lang]}</span>`;
}
function renderDay(){
  const d=DAYS[day];
  document.querySelectorAll('.wrap').forEach(w=>w.style.setProperty('--c',`var(${d.color})`));
  $('daytheme').textContent=d.theme[lang];
  $('daybar').innerHTML=`<span>${T.weather[lang]}: <strong>${d.weather[lang]}</strong></span><span>${T.sunset[lang]}: <strong>${d.sunset}</strong></span><span>${T.walk[lang]}: <strong>${d.walk}</strong></span>`;
  $('tips').innerHTML=`<h4>${T.tipsH[lang]}</h4><ul>${d.tips[lang].map(t=>`<li>${t}</li>`).join('')}</ul>`;
  const b=d.bonus; $('bonus').innerHTML=(b&&nyNow().date<=b.until)?`<div class="bonus"><svg width="22" height="22" viewBox="0 0 24 24" fill="var(--gold)"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.2l7.1-.6z"/></svg><div><b>${b[lang][0]}</b><br>${b[lang][1]}</div></div>`:'';
  renderStops();
}
function renderStops(){
  const d=DAYS[day], cur=currentIdx(d);
  $('stops').innerHTML=d.stops.map((s,i)=>`<li><div class="stop" role="button" tabindex="0" id="stop-${i}" aria-current="${i===active}">
    <span class="num">${i+1}</span>
    <svg class="pic" viewBox="0 0 48 48" aria-hidden="true">${PIC[PICS[d.id][i]]||''}</svg>
    <div class="st-head"><span class="time">${s.t}</span>${i===cur?`<span class="now">${T.now[lang]}</span>`:''}<h3>${s.name[lang]}</h3></div>
    <div class="st-body">
      <div class="how">${ICON[s.mode]}<span>${s.how[lang]}</span></div>
      <p class="note">${s.note[lang]}${s.link?` <a href="${s.link[1]}" target="_blank" rel="noopener">${s.link[0]} ↗</a>`:''}</p>
      <div class="words"><small>${T.words[lang]}</small><ul>${s.words.map(([en,tr])=>`<li><b>${en}</b> <span>= ${tr}</span></li>`).join('')}</ul></div>
    </div></div></li>`).join('');
  d.stops.forEach((s,i)=>{const n=$('stop-'+i); n.onclick=e=>{if(e.target.closest('a'))return;select(i,false)}; n.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(i,false)}};});
}
function select(i,fromMap){
  active=i; renderStops(); drawDay();
  const d=DAYS[day]; const pts=[P(...d.stops[i].ll)]; if(i>0) pts.push(P(...d.stops[i-1].ll)); else pts.push(P(...HOME.ll));
  animateTo(boxFor(pts,70));
  if(fromMap) $('stop-'+i).scrollIntoView({behavior:'smooth',block:'center'});
}
/* ---------- header cartoon scenes ---------- */
const SAY={greet:{tr:'Hoş geldiniz!',en:'Welcome!'},thu:{tr:'Balonlar geliyor!',en:'Balloons are coming!'},fri:{tr:'Alışverişe!',en:'Shopping time!'},sat:{tr:'Haydi vapura!',en:'All aboard!'}};
const art=$('art'); let sayTimer, greetTimer, mood='greet';
function say(key){
  const t=$('bubble-t'); t.textContent=SAY[key][lang];
  art.classList.add('says');
  try{const w=t.getComputedTextLength()+24; const r=art.querySelector('#bubble rect'); r.setAttribute('width',w); r.setAttribute('x',110-w/2);}catch(e){}
  clearTimeout(sayTimer); sayTimer=setTimeout(()=>art.classList.remove('says'),2600);
}
function playScene(greet){
  clearTimeout(greetTimer);
  art.setAttribute('class',''); void art.getBoundingClientRect();
  const sc='s-'+DAYS[day].id;
  if(greet){ mood='greet'; art.setAttribute('class','greet'); say('greet');
    greetTimer=setTimeout(()=>{ mood=DAYS[day].id; art.setAttribute('class',sc); say(DAYS[day].id); },2700);
  } else { mood=DAYS[day].id; art.setAttribute('class',sc); say(DAYS[day].id); }
}
art.addEventListener('click',()=>playScene(true));
art.style.cursor='pointer';

function renderAll(){renderChrome();renderDay();drawDay();}
$('btn-tr').onclick=()=>{lang='tr';try{localStorage.setItem('nyc-lang',lang)}catch(e){}renderAll();say(mood);};
$('btn-en').onclick=()=>{lang='en';try{localStorage.setItem('nyc-lang',lang)}catch(e){}renderAll();say(mood);};

drawBase(); renderAll(); playScene(true);
vb=boxFor([HOME.ll,...DAYS[day].stops.map(s=>s.ll)].map(ll=>P(...ll)),40); layout();
